[package]
name = "glassflow"
version = "0.1.0"
description = "A sophisticated command-driven AI IDE with intelligent multi-agent orchestration"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
dirs = "5.0"
anyhow = "1.0"
tempfile = "3.8"
dotenvy = "0.15"

[dev-dependencies]
mockall = "0.12"
proptest = "1.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
